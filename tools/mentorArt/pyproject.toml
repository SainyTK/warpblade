[project]
name = "warpblade-mentor-art"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy", "openai", "pillow", "python-dotenv"]

[dependency-groups]
dev = ["ruff"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.uv]
package = false
