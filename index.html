<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Warpblade: a pixel art action game about a warp knight, with every sprite and effect drawn in code." />
    <meta name="theme-color" content="#0c0a18" />
    <title>Warpblade</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <canvas class="backdrop" id="backdrop" aria-hidden="true"></canvas>
    <div class="safe-area" id="safeArea" aria-hidden="true"></div>

    <main class="stage" id="stage">
      <canvas id="game" width="320" height="180" tabindex="0" aria-label="Warpblade game. Open the menu with Escape or P, or the pause button, to see the controls."></canvas>
      <div class="hud">
        <div class="bars">
          <div class="bar hp"><span>HP</span><div class="track"><div class="fill" id="hpFill"></div></div></div>
          <div class="bar mp"><span>MP</span><div class="track"><div class="fill" id="mpFill"></div></div></div>
          <div class="bar xp"><span id="level">LV 1</span><div class="track"><div class="fill" id="xpFill"></div></div></div>
          <div class="chain-row"><span class="label">COMBO</span><span class="pips" id="chain"></span><span class="points" id="points"></span></div>
        </div>
        <div class="right">
          <div class="elements">
            <span class="el fire" id="elFire">FIRE</span>
            <span class="el ice" id="elIce">ICE</span>
            <span class="el volt" id="elVolt">BOLT</span>
          </div>
          <div class="score" id="wave">STAGE 1 WAVE 0/30</div>
          <div class="score" id="score">0 DOWN</div>
          <div class="ult"><span id="ultName"></span><span class="pips" id="ultPips"></span></div>
        </div>
      </div>
      <div class="boss" id="boss" hidden>
        <span id="bossName"></span>
        <div class="track"><div class="fill" id="bossFill"></div></div>
      </div>
      <div class="banner" id="banner"></div>
    </main>

    <button class="pause" id="pauseButton" type="button" aria-label="Pause"><i></i><i></i></button>

    <div class="touch" aria-label="On-screen buttons">
      <div class="pad" id="touchPad"></div>
      <div class="acts" id="touchActs"></div>
    </div>

    <div class="menu" id="menu" hidden>
      <div class="menu-panel" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
        <header class="menu-head">
          <h1 id="menuTitle"></h1>
          <p id="menuSub"></p>
        </header>
        <div class="menu-body" id="menuBody"></div>
      </div>
    </div>

  <dialog class="skills" id="skills" aria-labelledby="skillsTitle">
    <div class="skills-head">
      <div>
        <h2 id="skillsTitle">Skill tree</h2>
        <p id="skillsSummary"></p>
      </div>
      <button class="primary" id="skillsContinue" type="button">Continue</button>
    </div>
    <p class="skills-hint">Paths run left to right. Skills joined by "or" exclude each other for the whole run. Fusion skills need one skill from each of two paths. Unspent points carry over.</p>
    <div class="tree" id="skillBranches"></div>
    <div class="detail" id="skillDetail" aria-live="polite">
      <img class="detail-icon" id="detailIcon" alt="" width="48" height="48" />
      <div class="detail-text">
        <h3 id="detailName"></h3>
        <p class="detail-kind" id="detailKind"></p>
        <p id="detailText"></p>
        <p class="detail-path" id="detailPath"></p>
        <p class="detail-status" id="detailStatus"></p>
      </div>
      <button class="primary" id="detailLearn" type="button">Learn</button>
    </div>
  </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
