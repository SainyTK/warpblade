<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Warpblade: a pixel art action game about a warp knight, with every sprite and effect drawn in code." />
    <meta name="theme-color" content="#0c0a18" />
    <title>Warpblade</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html,
      body {
        background: #0c0a18;
      }
    </style>
    <link rel="preload" href="/node_modules/@fontsource/silkscreen/files/silkscreen-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource/pixelify-sans/files/pixelify-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body data-menu="title">
    <canvas class="backdrop" id="backdrop" aria-hidden="true"></canvas>
    <div class="safe-area" id="safeArea" aria-hidden="true"></div>

    <main class="stage" id="stage">
      <canvas id="game" width="320" height="180" tabindex="0" aria-label="Warpblade game. Open the menu with Escape or P, or the pause button, to see the controls."></canvas>
      <canvas class="danger-glow" id="dangerGlow" aria-hidden="true" hidden></canvas>
      <div class="hud">
        <div class="bars">
          <div class="bar hp" id="hpBar"><span>HP</span><div class="track"><div class="fill" id="hpFill"></div><div class="debt" id="hpDebt" hidden></div><b class="shards" id="hpShards" hidden><i></i><i></i><i></i><i></i></b><i class="tick" id="hpTick" hidden></i></div></div>
          <div class="bar mp" id="mpBar"><span>MP</span><div class="track"><div class="fill" id="mpFill"></div></div></div>
          <div class="bar st" id="stBar"><span>ST</span><div class="track"><div class="fill" id="stFill"></div></div></div>
          <div class="bar ht" id="heatBar" hidden><span>HT</span><div class="track"><div class="fill" id="heatFill"></div></div></div>
          <div class="bar gr" id="gritBar" hidden><span>GR</span><div class="track"><div class="fill" id="gritFill"></div><div class="plates" id="gritPlates"></div></div></div>
          <div class="bar qv" id="quiverBar" hidden><span>QV</span><div class="track"><div class="fill" id="quiverFill"></div><div class="window" id="reloadWindow"></div><div class="needle" id="reloadNeedle"></div></div></div>
          <div class="bar mo" id="momentumBar" hidden><span>MO</span><div class="track"><div class="fill" id="momentumFill"></div></div></div>
          <div class="bar sd" id="sandBar" hidden><span>SD</span><div class="track"><div class="fill" id="sandFill"></div></div></div>
          <div class="bar gl" id="gloamBar" hidden><span>GL</span><div class="track"><div class="fill" id="gloamFill"></div></div></div>
          <div class="bar gv" id="grooveBar" hidden><span>GV</span><div class="track" id="groovePips"></div><b class="lamp" id="beatLamp"></b></div>
          <div class="bar wx" id="waxBar" hidden><span>WX</span><div class="track"><div class="fill" id="waxFill"></div></div><b id="wickCount">0/4</b></div>
          <div class="bar fl" id="flowBar"><span>FL</span><div class="track"><div class="fill" id="flowFill"></div></div><b id="flowMult">x1.0</b></div>
          <div class="bar xp"><span id="level">LV 1</span><div class="track"><div class="fill" id="xpFill"></div></div></div>
          <div class="chain-row"><span class="label">COMBO</span><span class="pips" id="chain"></span></div>
          <div class="build-strip" id="buildStrip" aria-label="Relics and charms"></div>
        </div>
        <div class="right">
          <div class="elements">
            <span class="el warp" id="warpTab">WARP</span>
            <span class="ability-tabs" id="abilityTabs"></span>
            <span class="rite-tabs" id="riteTabs" hidden></span>
            <span class="rite-tabs" id="huldaTabs" hidden></span>
            <span class="rite-tabs" id="mirelTabs" hidden></span>
            <span class="rite-tabs" id="wennaTabs" hidden></span>
            <span class="rite-tabs" id="tallisTabs" hidden></span>
            <span class="rite-tabs" id="joryTabs" hidden></span>
            <span class="rite-tabs" id="brannocTabs" hidden></span>
          </div>
          <div class="score" id="wave">STAGE 1 WAVE 0/30</div>
          <div class="score coin-count" id="coinCount"></div>
          <div class="score" id="score">0 DOWN</div>
          <div class="ult"><span id="ultName"></span><span class="pips" id="ultPips"></span></div>
        </div>
      </div>
      <div class="boss" id="boss" hidden>
        <span id="bossName"></span>
        <div class="track"><div class="fill" id="bossFill"></div></div>
      </div>
      <div class="hit-count" id="hitCount"><b id="hitCountNumber"></b><span>HITS</span></div>
      <div class="banner" id="banner"></div>
    </main>

    <button class="pause" id="pauseButton" type="button" aria-label="Pause"><i></i><i></i></button>

    <div id="touch" hidden></div>

    <div class="menu" id="menu" hidden>
      <div class="menu-panel" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
        <header class="menu-head">
          <h1 id="menuTitle"></h1>
          <p id="menuSub"></p>
        </header>
        <div class="menu-body" id="menuBody"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
