<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Warpblade: a pixel art action game about nine sword heroes, with every sprite and effect drawn in code." />
    <meta name="theme-color" content="#0c0a18" />
    <title>Warpblade</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html,
      body {
        background: #0c0a18;
      }
    </style>
    <link rel="preload" href="/node_modules/@fontsource/silkscreen/files/silkscreen-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource/pixelify-sans/files/pixelify-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body data-menu="title">
    <canvas class="backdrop" id="backdrop" aria-hidden="true"></canvas>
    <div class="safe-area" id="safeArea" aria-hidden="true"></div>

    <main class="stage" id="stage">
      <canvas id="game" width="320" height="180" tabindex="0" aria-label="Warpblade game. Open the menu with Escape or P, or the pause button, to see the controls."></canvas>
      <button class="mentor-prompt" id="mentorPrompt" type="button" aria-label="Talk to mentor" hidden>Talk <kbd></kbd></button>
      <canvas class="danger-glow" id="dangerGlow" aria-hidden="true" hidden></canvas>
      <div class="hud">
        <div class="bars">
          <div class="bar hp" id="hpBar"><span>HP</span><div class="lane"><div class="track"><div class="fill" id="hpFill"></div></div><b id="hpRate" hidden></b></div></div>
          <div class="bar mp" id="mpBar"><span>MP</span><div class="lane"><div class="track"><div class="fill" id="mpFill"></div></div></div></div>
          <div class="bar st" id="stBar"><span>ST</span><div class="track"><div class="fill" id="stFill"></div></div></div>
          <div class="bar kit" id="kitBar" hidden><span id="kitLabel"></span><div class="track"><div class="fill" id="kitFill"></div></div><b id="kitText"></b></div>
          <div class="bar fl" id="flowBar"><span>FL</span><div class="track"><div class="fill" id="flowFill"></div></div><b id="flowMult">x1.0</b></div>
          <div class="bar xp"><span id="level">LV 1</span><div class="track"><div class="fill" id="xpFill"></div></div></div>
          <div class="tray">
            <div class="chain-row"><span class="label">COMBO</span><span class="pips" id="chain"></span></div>
            <div class="build-box">
              <div class="build-strip" id="buildStrip" aria-label="Relics and charms"></div>
              <div class="build-strip build-reserve" id="buildReserve" aria-hidden="true"></div>
            </div>
          </div>
        </div>
        <div class="right">
          <div class="elements">
            <span class="el warp" id="warpTab">WARP</span>
            <span class="ability-tabs" id="abilityTabs"></span>
          </div>
          <div class="tab-reserve" aria-hidden="true">
            <span class="el warp">WARP</span>
            <span class="ability-tabs" id="abilityReserve"></span>
          </div>
          <div class="score" id="wave">STAGE 0%</div>
          <div class="score coin-count" id="coinCount"></div>
          <div class="score" id="score"><span id="downCount">0 DOWN</span><span class="best-run" id="bestRun"></span></div>
          <div class="ult"><span id="ultName"></span><span class="pips" id="ultPips"></span></div>
        </div>
      </div>
      <div class="boss" id="boss" hidden>
        <span class="boss-head"><span id="bossName"></span><span class="boss-enrage" id="bossEnrage"></span></span>
        <div class="track"><div class="fill" id="bossFill"></div><div class="marks" id="bossMarks"></div></div>
        <div class="poise" id="bossPoise" hidden><div class="fill" id="bossPoiseFill"></div></div>
      </div>
      <div class="boss-card" id="bossCard" aria-live="polite">
        <small id="bossCardLabel"></small>
        <b id="bossCardName"></b>
        <span id="bossCardSub"></span>
      </div>
      <div class="hit-count" id="hitCount"><b id="hitCountNumber"></b><span>HITS</span></div>
      <div class="banner" id="banner"></div>
    </main>

    <button class="pause" id="pauseButton" type="button" aria-label="Pause"><i></i><i></i></button>

    <div id="touch" hidden></div>

    <div class="menu" id="menu" hidden>
      <div class="menu-panel" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
        <header class="menu-head">
          <h1 id="menuTitle"></h1>
          <p id="menuSub"></p>
        </header>
        <div class="menu-body" id="menuBody"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
